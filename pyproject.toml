[project]
name = "eedi-rag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1.1",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "duckdb>=1.0.0",
    "chromadb>=0.5.0",
    "logger>=1.4",
    "openai>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] [%(name)s:%(lineno)d] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore::DeprecationWarning",
]
